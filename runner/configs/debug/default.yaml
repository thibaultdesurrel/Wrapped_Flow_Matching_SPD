# @package _global_

# default debugging setup, runs 1 full epoch on CPU with anomaly detection
# usage: uv run src/train.py debug=default

callbacks: null
logger: null

paths:
  log_dir: ${paths.root_dir}/logs_debug

hydra:
  job_logging:
    root:
      level: INFO
    loggers:
      lightning.pytorch:
        level: DEBUG

trainer:
  max_epochs: 1
  accelerator: cuda
  devices: 1
  detect_anomaly: true