# @package _global_

defaults:
  - override /model: geodesic_cfm
  - override /datamodule: BNCI2015001

experiment:
  name: "BNCI2015001_geodesiccfm"

seed: 42

model:
  dim: 13
  dtype: float64
  num_classes: 2
  lr: 1e-4
  factor_lr: 0.1
  warmup_epochs: 200
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
  net:
    _target_: backbones.mlp_simple.MLP
    input_dim: 91       # dim*(dim+1)/2 = 13*14/2
    cond_dim: ${model.num_classes}
    n_layers: 6
    hidden_dim: 512
    dtype: ${model.dtype}

trainer:
  max_epochs: 10000
  check_val_every_n_epoch: null
  val_check_interval: 5000
  max_steps: 100000
