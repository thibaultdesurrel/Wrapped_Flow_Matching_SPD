# @package _global_

defaults:
  - override /model: diffeo_cfm
  - override /datamodule: BNCI2014002

experiment:
  name: "BNCI2014002_diffeocfm"

seed: 42

model:
  dim: 15
  dtype: float64
  num_classes: 2
  lr: 1e-3
  factor_lr: 0.1
  warmup_epochs: 10
  epochs: 2000
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
  net:
    _target_: backbones.mlp_simple.MLP
    input_dim: 120      # dim*(dim+1)/2
    cond_dim: ${model.num_classes}
    n_layers: 1
    hidden_dim: 512
    dtype: ${model.dtype}

trainer:
  max_epochs: 2000
  check_val_every_n_epoch: 20
