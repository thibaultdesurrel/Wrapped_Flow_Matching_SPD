# @package _global_

defaults:
  - override /model: wrapped_cfm_with_prior
  - override /datamodule: breizhcrops

experiment:
  name: "breizhcrops_wrappedcfm_with_prior"

seed: 42

hydra:
  run:
    dir: ${paths.log_dir}/${experiment.name}/seed_${seed}/${now:%Y-%m-%d_%H-%M-%S}

model:
  dim: 13
  dtype: float64
  num_classes: 4
  lr: 1e-4
  factor_lr: 0.1
  warmup_epochs: 200
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
  net:
    _target_: backbones.mlp_simple.MLP
    input_dim: 91      # dim*(dim+1)/2 = 13*14/2
    cond_dim: ${model.num_classes}
    n_layers: 6
    hidden_dim: 512
    dtype: ${model.dtype}

trainer:
  max_epochs: 2000
  check_val_every_n_epoch: null
