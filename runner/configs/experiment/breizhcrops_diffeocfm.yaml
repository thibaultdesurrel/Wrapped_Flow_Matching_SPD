# @package _global_

defaults:
  - override /model: diffeo_cfm
  - override /datamodule: breizhcrops

experiment:
  name: "breizhcrops_diffeocfm"

seed: 42

hydra:
  run:
    dir: ${paths.log_dir}/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}

model:
  dim: 13
  dtype: float64
  num_classes: 4
  lr: 1e-3
  factor_lr: 0.1
  warmup_epochs: 10
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
  net:
    _target_: backbones.mlp_simple.MLP
    input_dim: 91      # dim*(dim+1)/2 = 13*14/2
    cond_dim: ${model.num_classes}
    n_layers: 1
    hidden_dim: 512
    dtype: ${model.dtype}

trainer:
  max_epochs: 5000
  check_val_every_n_epoch: 20
